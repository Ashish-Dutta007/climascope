<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>ClimaScope — Wall Display</title>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet"
        integrity="sha384-p5cy4wHtKSqjnLUNjQ+8ffCwUp0vlLS+6lg1lc3qqXax2E1EmVCMCAimU+R0MOZH" crossorigin="anonymous" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"
          integrity="sha384-3WUbXI7T+/GIrWP/5MDMjhzLyHQ+0utF3PnJ7ozD7UeN1/bbZ96Hk+Vvd024VYfW" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/static/immersive/immersive.css?v={{ av('immersive/immersive.css') }}" />
  <link rel="stylesheet" href="/static/immersive/remote.css?v={{ av('immersive/remote.css') }}" />
  <link rel="stylesheet" href="/static/immersive/scenes.css?v={{ av('immersive/scenes.css') }}" />
</head>
<body data-summary-v="{{ av('immersive/summaries/v2/mean.json') }}"
      data-scenes-v="{{ av('immersive/summaries/scenes-v1/mean.json') }}">
  <div id="wall">
    <div id="panels"></div>
    <footer id="wall-footer">
      <span class="footer-logo">ClimaScope</span>
      <span class="footer-note">Monthly averages over 30-year periods</span>
      <span class="footer-note" id="footer-method">Regional means: valid 1 km climate cells, equally weighted</span>
    </footer>
  </div>
  <script src="/static/immersive/scenes.js?v={{ av('immersive/scenes.js') }}"></script>
  <script src="/static/immersive/remote.js?v={{ av('immersive/remote.js') }}"></script>
  <script src="/static/immersive/immersive.js?v={{ av('immersive/immersive.js') }}"></script>
</body>
</html>
