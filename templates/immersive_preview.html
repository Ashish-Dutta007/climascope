<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ClimaScope · Wall preview</title>
  <link rel="stylesheet" href="/static/immersive/preview.css?v={{ av('immersive/preview.css') }}">
  <link rel="stylesheet" href="/static/immersive/places.css?v={{ av('immersive/places.css') }}">
</head>
<body>
  <header><a href="/">ClimaScope</a><h1>Wall preview</h1>
  </header>
  <main>
    <div class="preview-controls">
      <label>Wall size<select id="wall-size"><option value="11514">Open · 11,514 × 1,200</option><option value="15360">Full wrap · 15,360 × 1,200</option></select></label>
      <label>View<select id="scene-select"></select></label>
      <label id="focus-control" hidden>Metric<select id="focus-select"><option value="CWBPT">Climate water balance</option><option value="Prec_sum">Precipitation</option><option value="Tmax_mean">Mean daily maximum temperature</option></select></label>
      <label>Month<select id="month-select"></select></label>
      <label>Ensemble<select id="member-select"><option value="mean">Ensemble mean</option></select></label>
      <label>Preview size<select id="preview-scale"><option value="fit">Fit whole wall</option><option value="0.25">25% · scroll to inspect</option><option value="0.5">50% · scroll to inspect</option><option value="1">100% · actual pixels</option></select></label>
    </div>
    <div class="preview-controls region-controls">
      <label>Council<select id="council-select"><option value="">All Scotland</option></select></label>
      <label>Catchment<select id="catchment-select"><option value="">All Scotland</option></select></label>
      <button id="reset-region" type="button">Reset to Scotland</button>
    </div>
    <form id="preview-postcode-form" class="preview-controls">
      <label>Postcode<input id="preview-postcode" autocomplete="postal-code" placeholder="e.g. PH2 7HP" maxlength="10" required></label>
      <button type="submit">Find climate</button>
      <span id="preview-location-status" role="status"></span>
      <div id="preview-location-scopes"></div>
    </form>
    <div id="saved-places"></div>
    <p class="places-hint">Save up to 8 places. Place loop keeps the month and ensemble selection.</p>
    <p id="scene-description"></p>
    <div class="playback-controls">
      <button id="prev-month" type="button">Previous month</button>
      <button id="play-pause" type="button">Play</button>
      <button id="next-month" type="button">Next month</button>
      <button id="annual" type="button">Month loop</button>
      <button id="tour" type="button">Scene loop</button>
      <label>Seconds per step<select id="dwell-select"><option>4</option><option selected>6</option><option>10</option><option>15</option><option>20</option></select></label>
      <button id="copy-link" type="button">Copy this view</button>
    </div>
    <p id="preview-status" role="status" aria-live="polite">Preparing the wall…</p>
    <div id="viewport"><div id="frame-space"><iframe id="wall-frame" title="Interactive ClimaScope wall preview"></iframe></div></div>
    <p class="preview-help" id="dimensions"></p>
    <p class="preview-help">Use Fit for the whole wall, or 25% / 50% to read a section.</p>
    <input id="view-link" aria-label="Link to the selected preview" readonly hidden>
  </main>
  <script src="/static/immersive/scenes.js?v={{ av('immersive/scenes.js') }}"></script>
  <script src="/static/js/climate_profile.js?v={{ av('js/climate_profile.js') }}"></script>
  <script src="/static/immersive/places.js?v={{ av('immersive/places.js') }}"></script>
  <script src="/static/immersive/preview.js?v={{ av('immersive/preview.js') }}"></script>
</body>
</html>
